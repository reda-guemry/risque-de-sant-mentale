[project]
name = "risque-de-sant-mentale"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dill>=0.4.1",
    "joblib>=1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "streamlit>=1.30",
    "xgboost-cpu>=3.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
airflow = [
    "apache-airflow[postgres]>=3.4,<4",
]
