name: risque-sante-mentale

# ---------------------------------------------------------------------------
# Configuration commune aux services Airflow
# ---------------------------------------------------------------------------
x-airflow-common: &airflow-common
  build:
    context: .
    target: airflow
  environment: &airflow-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-dev-jwt-secret-change-me}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-dev-api-secret-key-change-me}
  volumes:
    - models_data:/app/models
  depends_on:
    postgres:
      condition: service_healthy

services:
  # -------------------------------------------------------------------------
  # Base de données des métadonnées Airflow
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # -------------------------------------------------------------------------
  # Initialisation de la base Airflow (migration, une seule fois)
  # -------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    command: ["airflow", "db", "migrate"]
    restart: "no"

  # -------------------------------------------------------------------------
  # Interface web / API Airflow
  # -------------------------------------------------------------------------
  airflow-apiserver:
    <<: *airflow-common
    command: ["airflow", "api-server", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -------------------------------------------------------------------------
  # Scheduler : exécute les tâches (LocalExecutor)
  # -------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    command: ["airflow", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------------
  # Dag processor : analyse les fichiers DAG
  # -------------------------------------------------------------------------
  airflow-dag-processor:
    <<: *airflow-common
    command: ["airflow", "dag-processor"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------------
  # Entraînement (one-shot) : docker compose run --rm trainer
  # -------------------------------------------------------------------------
  trainer:
    build:
      context: .
      target: trainer
    volumes:
      - models_data:/app/models
    profiles: ["train"]

  # -------------------------------------------------------------------------
  # Interface Streamlit
  # -------------------------------------------------------------------------
  streamlit:
    build:
      context: .
      target: streamlit
    ports:
      - "8501:8501"
    volumes:
      - models_data:/app/models
    restart: unless-stopped

volumes:
  postgres_data:
  models_data:
